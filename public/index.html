 if(bank(T)<0)return toast('The bank will not lend while you are in the red.');if(ldebt(G.me)+a>LN_MAX)return toast('Debt limit is $'+LN_MAX+'M. You owe $'+ldebt(G.me)+'M.');
 const r=ldRate(G.me);G.ln=G.ln||[];G.ln.push({id:G.nln=(G.nln||0)+1,t:G.me,p:a,a,y,left:y,r});T.bk=bk0(T)+a;mail('Loan approved','$'+a+'M at '+r+'% over '+y+' season(s). Payments leave the bank at each season end.','Event');toast('Loan of $'+a+'M approved')}

 T.bk=bk0(T)-l.p;G.ln=G.ln.filter(x=>x!==l);G.k.lp=1;mail('Loan repaid','You paid off $'+l.p.toFixed(1)+'M early.','Event');toast('Loan repaid')}
function loanPay(){const L=G.ln||[];if(!L.length)return;
 L.forEach(l=>{const T=G.T[l.t];if(!T)return;const pr=Math.min(l.p,l.a/l.y),it=l.p*l.r/100,tot=pr+it;T.bk=bk0(T)-tot;l.p=+(l.p-pr).toFixed(2);l.left--;

 G.ln=L.filter(l=>l.left>0&&l.p>.05);G.T.forEach(T=>{if(drHum().includes(T.id)&&T.bk<0)mail('Financial trouble','Your bank balance is $'+T.bk.toFixed(1)+'M. You cannot borrow or upgrade facilities until it is positive.','Event',T.id)})}

const mkMask=k=>{const m=Array(256).fill(0),t=MT[k],f=(a,v)=>a.forEach(([x1,y1,x2,y2])=>{for(let y=y1;y<=y2;y++)for(let x=x1;x<=x2;x++)m[y*16+x]=v});f(t.r,1);f(t.h,0);return m};
